# Configuración mínima para servir un SPA de Angular.
# `try_files ... /index.html` es lo que permite refrescar una ruta profunda
# (ej. /sorteo) sin recibir un 404 de nginx: Angular Router resuelve la ruta
# en el cliente a partir de index.html.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # DNS embebido de Docker. Necesario para que el hostname del backend se
    # resuelva EN CADA PETICIÓN (vía la variable $backend más abajo) en vez
    # de una sola vez al arrancar nginx: si el backend no estuviera resoluble
    # justo en ese instante (redeploy, reinicio), nginx fallaría al arrancar
    # y se quedaría caído hasta el próximo restart manual.
    resolver 127.0.0.11 valid=10s;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy interno al backend real, dentro de la misma red Docker
    # (dokploy-network). El navegador solo habla con este dominio: evita
    # CORS por completo (mismo origen) y no depende del CORS del gateway
    # compartido, que hoy no está configurado para dominios nuevos.
    location /api/ {
        # Cuando proxy_pass usa una variable, nginx NO hace el append
        # automático del resto de la URI (a diferencia de un proxy_pass
        # estático) -- hay que agregarlo explícitamente con $request_uri,
        # o el backend solo recibe "/api/" sin el resto de la ruta.
        set $backend ruleta-ruletabackend-uacbfu;
        proxy_pass http://$backend:3000$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Los archivos con hash en el nombre (main-XXXX.js) pueden cachearse
    # agresivamente: un deploy nuevo genera un hash distinto.
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|svg|ico)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # index.html nunca se cachea: es el único archivo con nombre fijo, y
    # referencia los assets con hash del build actual.
    location = /index.html {
        add_header Cache-Control "no-store";
    }
}

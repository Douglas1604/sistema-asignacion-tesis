<div class="login-container">
  <div class="login-card">
    <div class="logo-container">
      <img src="/assets/images/logo-umg.png" alt="Logo UMG" class="login-logo">
    </div>
    <h2>Universidad Mariano Gálvez</h2>
    <h3>Sistema de Sorteo</h3>
    <p>Ingresa tus credenciales institucionales</p>
    
    <form (ngSubmit)="onLogin()">
      <div *ngIf="errorMessage" class="error-message">
        {{ errorMessage }}
      </div>

      <div class="form-group">
        <label for="email">Usuario o Correo Electrónico</label>
        <div class="input-with-icon">
          <!-- `type="text"` y no `type="email"`: con el tipo correo, el propio
               navegador rechazaba el formulario si se escribía el nombre de
               usuario ("admin"), sin llegar a enviar la petición. -->
          <i class="fas fa-user"></i> <input 
            type="text" 
            id="email" 
            name="email"
            autocomplete="username"
            [(ngModel)]="email" 
            placeholder="admin o ejemplo@miumg.edu.gt"
            required>
        </div>
      </div>
      
      <div class="form-group">
        <label for="password">Contraseña</label>
        <div class="input-with-icon">
          <i class="fas fa-lock"></i> <input 
            type="password" 
            id="password" 
            name="password"
            [(ngModel)]="password" 
            autocomplete="current-password"
            placeholder="******"
            required>
        </div>
      </div>
      
      <button type="submit" class="btn-umg">Ingresar</button>
    </form>
    <div class="login-footer">
      <p>© 2026 UMG - Facultad de Ingeniería</p>
    </div>
  </div>
</div>

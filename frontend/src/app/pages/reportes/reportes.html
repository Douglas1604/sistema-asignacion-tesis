<div class="dashboard-container">
  <aside class="sidebar">
    <div class="sidebar-header"><h2>UMG Admin</h2></div>
    <nav>
      <ul>
        <li><a href="/dashboard"><i class="fas fa-home" style="margin-right: 10px;"></i> Inicio</a></li>
        <li class="divider"></li>
        <li><a href="/sorteo"><i class="fas fa-dice" style="margin-right: 10px;"></i> Realizar Sorteo</a></li>
        <li><a href="/reportes" class="active"><i class="fas fa-file-excel" style="margin-right: 10px;"></i> Exportar Excel</a></li>
        <li class="logout"><a href="#" (click)="cerrarSesion($event)"><i class="fas fa-sign-out-alt" style="margin-right: 10px;"></i> Salir</a></li>
      </ul>
    </nav>
  </aside>

  <main class="content">
    <header class="umg-header">
      <div>
        <h1>Reportes Oficiales</h1>
        <p class="subtitle">Descarga de actas agrupadas por lote de sorteo</p>
      </div>
    </header>

    <div style="background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border-top: 4px solid #003366;">
      
      <div *ngIf="sorteosAgrupados.length === 0" style="text-align: center; padding: 40px; color: #666;">
        <i class="fas fa-folder-open" style="font-size: 3rem; color: #ccc; margin-bottom: 15px;"></i>
        <h2>No hay actas disponibles</h2>
      </div>

      <table class="umg-table" *ngIf="sorteosAgrupados.length > 0">
        <thead>
          <tr>
            <th>Modalidad del Sorteo</th>
            <th>Fecha y Hora</th>
            <th style="text-align: center;">Acciones</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let grupo of sorteosAgrupados">
            <td>
              <span class="badge" [style.background-color]="grupo.modalidad === 'Tesis' ? '#e0e7ff' : '#fef3c7'" [style.color]="grupo.modalidad === 'Tesis' ? '#4f46e5' : '#b45309'">
                {{ grupo.modalidad }}
              </span>
            </td>
            <td style="font-weight: 500; color: #333;">
              <i class="fas fa-calendar-alt" style="color: #666; margin-right: 8px;"></i> {{ grupo.fecha_formateada }}
            </td>
            <td style="text-align: center;">
              <div style="display: flex; gap: 10px; justify-content: center;">
                <button class="btn-umg-play" style="background-color: #10b981; padding: 8px 15px; font-size: 0.9rem;" (click)="exportarSorteoBatch(grupo)">
                  <i class="fas fa-file-excel"></i> Descargar
                </button>
                <button class="btn-umg-play" style="background-color: #ef4444; padding: 8px 15px; font-size: 0.9rem;" (click)="eliminarSorteoBatch(grupo)">
                  <i class="fas fa-trash"></i> Eliminar
                </button>
              </div>
            </td>
          </tr>
        </tbody>
      </table>

    </div>
  </main>
</div>
